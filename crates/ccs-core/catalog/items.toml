[[items]]
id = "uv"
group = "Package managers"
risk = "safe"
label = "uv cache (unused entries)"
action_id = "uv_cache_prune"
platforms = ["linux", "macos"]
roots = [
  { root = "cache_home", path = "uv", overrides = ["UV_CACHE_DIR"] },
]

[items.docs]
section = "Package managers"
path = "`${UV_CACHE_DIR:-$XDG_CACHE_HOME/uv}`"
action = "`uv cache prune`. Gives the first attempt 30 seconds by default, then announces one `--force` retry if uv supports it (0.8.24 or newer). Set `CLEANCODESHIT_UV_LOCK_TIMEOUT` in whole seconds or use `--force-uv` / `CLEANCODESHIT_UV_FORCE=1` to start with force. Force bypasses uv's in-use check and can disturb a running uv process. Pruning still targets unused entries, so the size shown can be larger than the saving."

[[items.docs.sources]]
label = "uv cache location"
url = "https://docs.astral.sh/uv/concepts/cache/#cache-directory"

[[items.docs.sources]]
label = "uv prune force"
url = "https://docs.astral.sh/uv/reference/cli/#uv-cache-prune--force"

[[items.docs.sources]]
label = "uv 0.8.24 release"
url = "https://github.com/astral-sh/uv/releases/tag/0.8.24"

