# Catalog schema 1. Legacy entries follow the Bash registration order.
# Roots are typed anchors with relative patterns. Overrides name settings
# documented in the reference cells. Future actions must apply the item-specific
# leaf allowlist after validating these anchors.

schema_version = 1

# ---------------------------------------------------------------------------
