# ---------------------------------------------------------------------------

[[items]]
id = "npm"
group = "Package managers"
risk = "safe"
label = "npm cache"
action_id = "npm_cache_clean"
platforms = ["linux", "macos"]
roots = [
  { root = "npm_cache", path = "_cacache", overrides = ["npm_config_cache", "NPM_CONFIG_CACHE"] },
]

[items.docs]
section = "Package managers"
path = "`$(npm config get cache)/_cacache`, default `~/.npm/_cacache`"
action = "`npm cache clean --force`"

