name: Site CI

on:
  push:
    paths:
      - 'site/**'
      - 'tests/check-site.mjs'
      - 'cleancodeshit'
      - '.github/workflows/deploy-site.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'tests/check-site.mjs'
      - 'cleancodeshit'
      - '.github/workflows/deploy-site.yml'

permissions:
  contents: read

jobs:
  site:
    name: Site checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      site_changed: ${{ steps.changes.outputs.site_changed }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check for deployable site changes
        id: changes
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref != 'main')
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            changed=$(git diff --name-only "$PR_BASE_SHA...$PR_HEAD_SHA" -- site/)
          else
            if [[ "$BEFORE_SHA" == 0000000000000000000000000000000000000000 ]]; then
              BEFORE_SHA=$(git hash-object -t tree /dev/null)
            fi
            changed=$(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" -- site/)
          fi
          if [[ -n "$changed" ]]; then
            echo 'site_changed=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node tests/check-site.mjs

  deploy:
    name: Deploy to Cloudflare Pages
    needs: site
    if: needs.site.outputs.site_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: cloudflare-pages-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: true
    steps:
      - name: Check deployment credentials
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Cloudflare Pages deployment skipped because credentials are unavailable.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: steps.credentials.outputs.available == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.credentials.outputs.available == 'true'
        with:
          node-version: '22'
      - name: Upload site
        if: steps.credentials.outputs.available == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          export WRANGLER_OUTPUT_FILE_PATH
          WRANGLER_OUTPUT_FILE_PATH=$(mktemp)
          trap 'rm -f "$WRANGLER_OUTPUT_FILE_PATH"' EXIT
          npx --yes wrangler@4.169.0 pages deploy site --project-name cleancodeshit --branch "$DEPLOY_BRANCH"
          url=$(jq -ers 'map(select(.type == "pages-deploy")) | last | .url' "$WRANGLER_OUTPUT_FILE_PATH")
          printf 'Cloudflare Pages deployment: <%s>\n' "$url" >> "$GITHUB_STEP_SUMMARY"
