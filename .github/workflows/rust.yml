name: Rust CI

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'cleancodeshit'
      - 'docs/items.md'
      - 'site/assets/app.js'
      - '.github/workflows/rust.yml'
      - 'scripts/windows-ci/*.ps1'
  pull_request:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'cleancodeshit'
      - 'docs/items.md'
      - 'site/assets/app.js'
      - '.github/workflows/rust.yml'
      - 'scripts/windows-ci/*.ps1'

permissions:
  contents: read

jobs:
  test:
    name: Rust 1.100.0 tests on ${{ matrix.os }}
    # GitHub-hosted runners are disposable: no account, profile or staging
    # state survives the job. The Windows fixture user below is created and
    # removed entirely inside this single job.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            toolchain: '1.100.0'
            host: x86_64-unknown-linux-gnu
          - os: macos-15
            toolchain: '1.100.0'
            host: aarch64-apple-darwin
          - os: windows-2025
            toolchain: '1.100.0'
            host: x86_64-pc-windows-msvc
          # Native ARM64: name the host triple in the toolchain itself and
          # assert rustc's host below. This is execution, not cross-compiling.
          - os: windows-11-arm
            toolchain: '1.100.0-aarch64-pc-windows-msvc'
            host: aarch64-pc-windows-msvc
    env:
      TOOLCHAIN: ${{ matrix.toolchain }}
      EXPECTED_HOST: ${{ matrix.host }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned Rust 1.100.0 via rustup
        shell: bash
        run: |
          set -eu
          rustup toolchain install "$TOOLCHAIN" --profile minimal --no-self-update
          rustc +"$TOOLCHAIN" --version
          cargo +"$TOOLCHAIN" --version
          host=$(rustc +"$TOOLCHAIN" -vV | sed -n 's/^host:[[:space:]]*//p')
          echo "native host: $host"
          test "$host" = "$EXPECTED_HOST"
      - name: Test the locked workspace
        shell: bash
        run: |
          set -eu
          if [ "$RUNNER_OS" = "Windows" ]; then
            # The dedicated Windows step runs these fixtures with their required tokens.
            cargo +"$TOOLCHAIN" test --workspace --all-targets --locked -- --skip windows_fs::
          else
            cargo +"$TOOLCHAIN" test --workspace --all-targets --locked
          fi
      - name: Build and locate the ccs-core lib test executable
        if: runner.os == 'Windows'
        id: test-exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $toolchain = "+$env:TOOLCHAIN"
          $json = Join-Path $env:RUNNER_TEMP 'ccs-core-lib-test.json'
          & cargo $toolchain test -p ccs-core --lib --no-run --locked --message-format=json-render-diagnostics 1> $json
          if ($LASTEXITCODE -ne 0) {
            throw "cargo test --no-run failed with exit code $LASTEXITCODE"
          }
          $found = @(
            Get-Content -LiteralPath $json | ForEach-Object {
              if ([string]::IsNullOrWhiteSpace($_)) { return }
              try { $message = $_ | ConvertFrom-Json } catch { return }
              if ($message.reason -ne 'compiler-artifact') { return }
              if ($message.target.name -ne 'ccs_core') { return }
              if ($message.target.kind -notcontains 'lib') { return }
              if (-not $message.profile.test) { return }
              if ([string]::IsNullOrEmpty($message.executable)) { return }
              $message.executable
            } | Select-Object -Unique
          )
          if ($found.Count -ne 1) {
            throw "Expected exactly one ccs-core lib test executable in cargo JSON; found $($found.Count)."
          }
          if (-not (Test-Path -LiteralPath $found[0] -PathType Leaf)) {
            throw "Cargo-reported test executable does not exist: $($found[0])"
          }
          "path=$($found[0])" >> $env:GITHUB_OUTPUT
      - name: Assert elevated refusal and run standard-user filesystem tests
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TEST_EXE: ${{ steps.test-exe.outputs.path }}
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            & ./scripts/windows-ci/run-windows-fs-tests.ps1 -TestExecutable $env:TEST_EXE
          } catch {
            Write-Error $_
            exit 1
          }
      - name: Check formatting
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          set -eu
          rustup component add rustfmt --toolchain 1.100.0
          cargo +1.100.0 fmt --all -- --check
      - name: Verify the generated catalog is current
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: cargo +1.100.0 run --locked -p ccs-core --example generate_catalog -- --check

  msrv:
    name: MSRV check with Rust 1.85.0
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install exactly Rust 1.85.0 via rustup
        shell: bash
        run: |
          set -eu
          rustup toolchain install 1.85.0 --profile minimal --no-self-update
          rustc +1.85.0 --version
          cargo +1.85.0 --version
      - name: Check the locked workspace with the MSRV
        shell: bash
        run: cargo +1.85.0 check --workspace --all-targets --locked
