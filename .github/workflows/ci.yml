name: CI

on:
  push:
    paths-ignore:
      - 'site/**'
  pull_request:
    paths-ignore:
      - 'site/**'

permissions:
  contents: read

jobs:
  shell:
    name: Shell checks on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned tools locally
        shell: /bin/bash {0}
        run: |
          set -eu
          npm install --prefix "$RUNNER_TEMP/cleancodeshit-tools" --no-save --no-package-lock --no-audit --no-fund bats@1.13.0
      - name: Install pinned ShellCheck
        if: runner.os == 'Linux'
        shell: /bin/bash {0}
        env:
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          set -eu
          # A release asset download, not the GitHub API, so it is not subject to API rate limits.
          dir="$RUNNER_TEMP/shellcheck"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/shellcheck.tar.xz" \
            "https://github.com/koalaman/shellcheck/releases/download/$SHELLCHECK_VERSION/shellcheck-$SHELLCHECK_VERSION.linux.x86_64.tar.xz"
          echo "$SHELLCHECK_SHA256  $dir/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf "$dir/shellcheck.tar.xz" -C "$dir"
          "$dir/shellcheck-$SHELLCHECK_VERSION/shellcheck" --version
      - name: Check Bash and lint scripts
        shell: /bin/bash {0}
        run: |
          set -eu
          /bin/bash --version
          if [ "$RUNNER_OS" = macOS ]; then
            /bin/bash -c 'test "$BASH_VERSINFO" = 3 && test "${BASH_VERSINFO[1]}" = 2'
          fi
          /bin/bash -n cleancodeshit
          /bin/bash -n install.sh
          # Lint once, on Linux; the result does not depend on the OS.
          if [ "$RUNNER_OS" = Linux ]; then
            "$RUNNER_TEMP/shellcheck/shellcheck-v0.11.0/shellcheck" \
              -x -P SCRIPTDIR cleancodeshit install.sh tests/run-tests.sh tests/test_helper.bash tests/shims/*
          fi
      - name: Run fake HOME tests
        shell: /bin/bash {0}
        env:
          BASH_UNDER_TEST: /bin/bash
        run: |
          set -eu
          export PATH="$RUNNER_TEMP/cleancodeshit-tools/node_modules/bats/bin:$PATH"
          /bin/bash tests/run-tests.sh
